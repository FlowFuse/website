[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self';"

[[redirects]]
from = "http://flowforge.com/*"
to = "http://flowfuse.com/:splat"
status = 301
force = true

[[redirects]]
from = "https://flowforge.com/*"
to = "https://flowfuse.com/:splat"
status = 301
force = true

[[redirects]]
from = "http://www.flowforge.com/*"
to = "http://flowfuse.com/:splat"
status = 301
force = true

[[redirects]]
from = "https://www.flowforge.com/*"
to = "https://flowfuse.com/:splat"
status = 301
force = true

[[redirects]]
from = "http://flowfuze.com/*"
to = "http://flowfuse.com/:splat"
status = 301
force = true

[[redirects]]
from = "https://flowfuze.com/*"
to = "https://flowfuse.com/:splat"
status = 301
force = true

[[redirects]]
from = "http://www.flowfuze.com/*"
to = "http://flowfuse.com/:splat"
status = 301
force = true

[[redirects]]
from = "https://www.flowfuze.com/*"
to = "https://flowfuse.com/:splat"
status = 301
force = true

[[redirects]]
from = "https://flowfuse.io/*"
to = "https://flowfuse.com/:splat"
status = 301
force = true

[dev]
port = 8080
framework = "#static"
command = "npx @11ty/eleventy --quiet --watch"
autoLaunch = false

[build]
command = "npm run build:nuxt:skip-images && npm run index:algolia"
publish = "nuxt/dist"

[build.environment]
NODE_OPTIONS = "--max-old-space-size=4096"

[functions]
directory = "nuxt/.netlify/functions-internal"

[[redirects]]
from = "/landing/accelerating-industrial-innovation-with-low-code-platforms/"
to = "/whitepaper/accelerating-industrial-innovation-with-low-code-platforms/"
status = 301

# Case-sensitive legacy casing redirects. These can't live in nuxt/redirects.ts:
# Nitro's route rules match case-insensitively, so a rule keyed on the old casing
# also matches the current lowercase canonical URL, redirecting it to itself in
# an infinite loop. Netlify's edge redirects match exact case, so they redirect
# only the old casing without touching the canonical URL.
[[redirects]]
from = "/blog/2023/05/Integrating-Modbus-with-Node-RED"
to = "/blog/2023/05/integrating-modbus-with-node-red/"
status = 301

[[redirects]]
from = "/blog/2026/03/Rethinking-Edge-AIs-Core-Orchestration/"
to = "/blog/2026/03/rethinking-edge-ais-core-orchestration/"
status = 301

[[redirects]]
from = "/*"
to = "/.netlify/functions/server"
status = 200

[context.deploy-preview]
command = "npm run build:nuxt"

[context.branch-deploy]
command = "npm run build:nuxt"

[[plugins]]
package = "netlify-plugin-cache"
  [plugins.inputs]
  paths = [
    "nuxt/public/img", # Eleventy Image Disk Cache
    ".cache/images", # Eleventy image processing cache
    "nuxt/node_modules/.cache/nuxt/.nuxt/cache/og-image", # nuxt-og-image's resolved font URLs + converted TTFs
    "nuxt/node_modules/.cache/nuxt/.nuxt/cache/og-image-render" # nuxt-og-image's rendered-image build cache
  ]
