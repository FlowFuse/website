[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self';"

[[redirects]]
from = "http://flowforge.com/*"
to = "http://flowfuse.com/:splat"
status = 301
force = true

[[redirects]]
from = "https://flowforge.com/*"
to = "https://flowfuse.com/:splat"
status = 301
force = true

[[redirects]]
from = "http://www.flowforge.com/*"
to = "http://flowfuse.com/:splat"
status = 301
force = true

[[redirects]]
from = "https://www.flowforge.com/*"
to = "https://flowfuse.com/:splat"
status = 301
force = true

[[redirects]]
from = "http://flowfuze.com/*"
to = "http://flowfuse.com/:splat"
status = 301
force = true

[[redirects]]
from = "https://flowfuze.com/*"
to = "https://flowfuse.com/:splat"
status = 301
force = true

[[redirects]]
from = "http://www.flowfuze.com/*"
to = "http://flowfuse.com/:splat"
status = 301
force = true

[[redirects]]
from = "https://www.flowfuze.com/*"
to = "https://flowfuse.com/:splat"
status = 301
force = true

[[redirects]]
from = "https://flowfuse.io/*"
to = "https://flowfuse.com/:splat"
status = 301
force = true

# `netlify dev` in front of the Nuxt dev server, for exercising the Netlify function
# locally. The normal dev loop is `npm run dev` on its own.
[dev]
command = "npm run dev"
targetPort = 3000
framework = "#custom"
autoLaunch = false

[build]
command = "npm run build:nuxt:skip-images && npm run index:algolia"
publish = "nuxt/dist"

[build.environment]
NODE_OPTIONS = "--max-old-space-size=4096"

[functions]
directory = "nuxt/.netlify/functions-internal"

[[redirects]]
from = "/landing/accelerating-industrial-innovation-with-low-code-platforms/"
to = "/whitepaper/accelerating-industrial-innovation-with-low-code-platforms/"
status = 301

# Case-sensitive legacy casing redirects. These can't live in nuxt/redirects.ts:
# Nitro's route rules match case-insensitively, so a rule keyed on the old casing
# also matches the current lowercase canonical URL, redirecting it to itself in
# an infinite loop. Netlify's edge redirects match exact case, so they redirect
# only the old casing without touching the canonical URL.
[[redirects]]
from = "/blog/2023/05/Integrating-Modbus-with-Node-RED"
to = "/blog/2023/05/integrating-modbus-with-node-red/"
status = 301

[[redirects]]
from = "/blog/2026/03/Rethinking-Edge-AIs-Core-Orchestration/"
to = "/blog/2026/03/rethinking-edge-ais-core-orchestration/"
status = 301

# One webinar was authored with a space in its filename, so 11ty published it at a URL
# carrying %20. @nuxt/content slugifies that space to a hyphen, so the file has been
# renamed to match and the published URL redirects here. This cannot live in
# nuxt/redirects.ts either: Nitro matches route rules on the decoded path, where the
# space is a literal one.
[[redirects]]
from = "/webinars/2025/live-from-the-shop-floor-scaling-from-digital%20to-smart-with-flowfuse-and-revolution-pi/"
to = "/webinars/2025/live-from-the-shop-floor-scaling-from-digital-to-smart-with-flowfuse-and-revolution-pi/"
status = 301

[[redirects]]
from = "/*"
to = "/.netlify/functions/server"
status = 200

[context.deploy-preview]
command = "npm run build:nuxt"

[context.branch-deploy]
# A pull request already gets a deploy preview for every commit, so a branch
# deploy of the same commit builds the site twice and takes a slot from the
# three concurrent builds Netlify gives us. Skip it. The command stays so that
# a branch deploy, should the ignore ever stop skipping, still builds Nuxt
# only, rather than falling through to the root [build] command, which also
# runs index:algolia and would write the search index from a branch.
command = "npm run build:nuxt"
ignore = "exit 0"

[[plugins]]
package = "netlify-plugin-cache"
  [plugins.inputs]
  paths = [
    "nuxt/node_modules/.cache/nuxt/.nuxt/cache/og-image", # nuxt-og-image's resolved font URLs + converted TTFs
    "nuxt/node_modules/.cache/nuxt/.nuxt/cache/og-image-render" # nuxt-og-image's rendered-image build cache
  ]
