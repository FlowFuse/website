<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img"
     aria-label="Your own AI agent connects to one FlowFuse address. FlowFuse checks the access you granted, then reaches your Node-RED instances and the editor session you have opened.">
  <title>How your own agent reaches FlowFuse</title>
  <defs>
    <marker id="ffa-arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,1 L7.5,4.5 L0,8 Z" fill="#4f46e5"/>
    </marker>
    <marker id="ffa-arrow-grey" markerWidth="10" markerHeight="10" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,1 L7.5,4.5 L0,8 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <g font-family="Roboto, system-ui, -apple-system, sans-serif">

    <!-- your agent -->
    <rect x="8" y="132" width="176" height="66" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="96" y="159" text-anchor="middle" font-size="15" fill="#111827">Your own AI agent</text>
    <text x="96" y="179" text-anchor="middle" font-size="12.5" fill="#6b7280">Copilot, ChatGPT, Claude</text>

    <path d="M184,165 L292,165" stroke="#4f46e5" stroke-width="1.5" fill="none" marker-end="url(#ffa-arrow)"/>
    <text x="238" y="155" text-anchor="middle" font-size="12" fill="#4338ca">signs in</text>

    <!-- boundary -->
    <line x1="312" y1="30" x2="312" y2="314" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="322" y="46" font-size="11" font-weight="600" letter-spacing="1.5" fill="#4338ca">WHAT YOU GRANTED</text>

    <!-- endpoint -->
    <rect x="330" y="126" width="196" height="78" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="428" y="152" text-anchor="middle" font-size="15" font-weight="500" fill="#3730a3">One FlowFuse address</text>
    <text x="428" y="173" text-anchor="middle" font-size="12.5" fill="#4338ca">which teams it may reach,</text>
    <text x="428" y="190" text-anchor="middle" font-size="12.5" fill="#4338ca">and whether it may change them</text>

    <path d="M526,165 L616,165" stroke="#4f46e5" stroke-width="1.5" fill="none" marker-end="url(#ffa-arrow)"/>

    <!-- flowfuse -->
    <rect x="634" y="132" width="118" height="66" fill="#ffffff" stroke="#d1d5db"/>
    <text x="693" y="159" text-anchor="middle" font-size="15" fill="#111827">FlowFuse</text>
    <text x="693" y="179" text-anchor="middle" font-size="12.5" fill="#6b7280">your platform</text>

    <!-- branches -->
    <path d="M752,148 L800,92" stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#ffa-arrow-grey)"/>
    <path d="M752,184 L800,240" stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#ffa-arrow-grey)"/>

    <rect x="812" y="54" width="100" height="66" fill="#ffffff" stroke="#d1d5db"/>
    <text x="862" y="80" text-anchor="middle" font-size="13.5" fill="#111827">Instances</text>
    <text x="862" y="99" text-anchor="middle" font-size="11.5" fill="#6b7280">and remote</text>

    <rect x="812" y="212" width="100" height="66" fill="#ffffff" stroke="#d1d5db"/>
    <text x="862" y="238" text-anchor="middle" font-size="13.5" fill="#111827">Your editor</text>
    <text x="862" y="257" text-anchor="middle" font-size="11.5" fill="#6b7280">when you open it</text>

    <!-- footnote -->
    <text x="330" y="296" font-size="12.5" fill="#6b7280">Your agent talks to one address. FlowFuse reaches the instances, so they stay unexposed.</text>
  </g>
</svg>
