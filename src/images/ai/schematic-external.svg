<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"
     role="img" aria-label="An external AI agent stays its own thing and overlaps the FlowFuse platform and Node-RED, reaching into it.">
  <title>An external agent reaching into the platform</title>
  <rect width="1600" height="900" fill="#ffffff"/>
  <!-- Geometry: two identical 900x520 boxes, offset by exactly +400,+250. Their union
       is 1300x770, centred in the 1600x900 frame, so the margins are 150 left and
       right and 65 top and bottom. Equal boxes and one equal offset are what make the
       overlap read as deliberate. -->
  <g font-family="Roboto, system-ui, -apple-system, 'Segoe UI', sans-serif">

    <!-- behind -->
    <rect x="550" y="315" width="900" height="520" rx="52" fill="#f9fafb" stroke="#d1d5db" stroke-width="3"/>
    <text x="1000" y="694" text-anchor="middle" font-size="44" fill="#374151">FlowFuse Platform</text>
    <text x="1000" y="748" text-anchor="middle" font-size="44" fill="#374151">Node-RED</text>

    <!-- in front. Opaque fill so it occludes the box behind it. -->
    <rect x="150" y="65" width="900" height="520" rx="52" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
    <text x="600" y="341" text-anchor="middle" font-size="44" fill="#3730a3">External AI agent</text>
  </g>
</svg>
