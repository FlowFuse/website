  - type: prose
    heading: Worked example - OEE, two packages, two connections
    body: >-
      OEE (Overall Equipment Effectiveness) tells you how much good product a line makes versus its
      full potential — one live number per line, plus history for trends. Most real apps are more than
      one piece. OEE joins an Edge Building Block and a Data-Driven App through the Team Broker, with
      an external time-series DB added for history.
  - type: cards
    columns: 2
    items:
      - title: Remote Instance (Edge Block)
        body: >-
          Reads the machine signals at the edge and publishes its state. Built once, rolled out to
          every device across the fleet.
      - title: Team Broker (MQTT)
        body: >-
          Carries machine state from edge to cloud. The edge publishes to a topic; the cloud app
          subscribes. Neither references the other.
      - title: Hosted Instance (Data-Driven App)
        body: >-
          Subscribes to the machine state, computes availability, performance and quality, and
          presents the OEE dashboard.
      - title: External time-series DB (Timescale / QuestDB)
        body: >-
          Each reading is written so trends can be charted over time. FlowFuse has no built-in
          time-series store, so history goes to an external Timescale/QuestDB reached over the
          Postgres wire protocol (a second egress, because the data is a timestamped stream).
  - type: sentence
    heading: The architecture, in one sentence
    body: >-
      OEE is a Hardware: Edge Building Block (on a Remote Instance) publishing machine state over the
      Team Broker to a Software: Data-Driven App (on a Hosted Instance), which computes and displays
      OEE and writes history to an external time-series DB (Timescale / QuestDB).
