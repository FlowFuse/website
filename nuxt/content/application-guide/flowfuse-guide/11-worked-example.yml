  - type: prose
    kicker: Worked example — start here
    body: >-
      OEE, end to end — how an Edge Building Block, the Team Broker, a Data-Driven App and an external
      time-series DB snap together into one architecture you can say in a sentence.
  - type: diagram
    lanes:
      - label: Cloud · platform — the app + history
        tone: cloud
