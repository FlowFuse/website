guide: node-red-guide
slug: overview
navOrder: 1
title: Overview
blurb: Turn an architecture sentence into a clean flow shape you can read at a glance.
blocks:
  - type: prose
    kicker: Node-RED — start here
    body: >-
      Node-RED is a visual programming platform for integration and logic: you build by wiring
      pre-built nodes into flows. The connectors and the syntax are handled for you, so your effort
      goes into what the system should do — the logic — not the plumbing to connect things or the
      boilerplate of a language.
  - type: steps
    heading: The method, in four moves
    items:
      - title: List the beginnings
        body: >-
          Every way work enters the piece: an http in, an MQTT in, an inject. Each beginning is its
          own path.
      - title: Name the shared services
        body: >-
          The pools and calls many paths depend on: a database pool, a model call, the broker. Call
          them, results return.
      - title: Pick the single sink
        body: The one sink each family of paths converges on. It responds, it routes nothing.
      - title: Draw the shape
        body: >-
          Paths across, services called in the middle, one sink each. Now you can read the flow at a
          glance.
  - type: linkCards
    heading: Flow shape
    columns: 2
    items:
      - title: Beginnings
        body: Every way work enters a piece, each as its own path.
        link:
          label: Flow shape →
          to: /bestpractice/node-red-guide/flow-shape/#beginnings
      - title: Shared services (link call)
        body: Shared pools and calls, invoked once, results return.
        link:
          label: Flow shape →
          to: /bestpractice/node-red-guide/flow-shape/#shared-services-link-call
      - title: Subflow vs link call
        body: When a link call is enough, and when a subflow earns its keep.
        link:
          label: Flow shape →
          to: /bestpractice/node-red-guide/flow-shape/#subflow-vs-link-call
      - title: Single sink
        body: The one sink each family of paths converges on — it only sends, never routes.
        link:
          label: Flow shape →
          to: /bestpractice/node-red-guide/flow-shape/#single-sink
  - type: linkCards
    heading: Design patterns
    columns: 3
    items:
      - title: Find the seams
        body: Find the three or four components hiding in a blob.
        link:
          label: Design patterns →
          to: /bestpractice/node-red-guide/design-patterns/#find-the-seams
      - title: Levels of reuse
        body: Pick the lowest rung of extraction that solves it.
        link:
          label: Design patterns →
          to: /bestpractice/node-red-guide/design-patterns/#levels-of-reuse
      - title: Decouple frontend & backend
        body: Treat the dashboard-to-logic boundary like a client and a server.
        link:
          label: Design patterns →
          to: /bestpractice/node-red-guide/design-patterns/#decouple-frontend-backend
      - title: Use the context store
        body: Hold the object in context instead of threading it through wires.
        link:
          label: Design patterns →
          to: /bestpractice/node-red-guide/design-patterns/#use-the-context-store
      - title: "Config: env vars vs persisted context"
        body: Env vars for deploy-time, persisted context for user edits.
        link:
          label: Design patterns →
          to: /bestpractice/node-red-guide/design-patterns/#config-env-vars-vs-persisted-context
      - title: Generating flows (Admin API)
        body: Emit flow JSON and deploy it through the Admin API.
        link:
          label: Design patterns →
          to: /bestpractice/node-red-guide/design-patterns/#generating-flows-admin-api
  - type: linkCards
    heading: Handling data (PLC)
    columns: 3
    items:
      - title: Classify the data
        body: Sort data by what it is for before tuning anything.
        link:
          label: Handling data →
          to: /bestpractice/node-red-guide/handling-data/#classify-the-data
      - title: How PLCs respond
        body: Every poll spends a slice of the controller scan budget.
        link:
          label: Handling data →
          to: /bestpractice/node-red-guide/handling-data/#how-plcs-respond
      - title: Treat data reliably
        body: Split telemetry from control, each on its own path.
        link:
          label: Handling data →
          to: /bestpractice/node-red-guide/handling-data/#treat-data-reliably
  - type: linkCards
    heading: Operating flows
    columns: 4
    items:
      - title: Error handling
        body: A Catch node per tab turns a thrown error into a route you control.
        link:
          label: Operating flows →
          to: /bestpractice/node-red-guide/operating-flows/#error-handling
      - title: Backpressure & memory
        body: Pace the fast side to the slow side before the heap blows.
        link:
          label: Operating flows →
          to: /bestpractice/node-red-guide/operating-flows/#backpressure-memory
      - title: Deploy modes
        body: Pick the smallest restart that ships the change.
        link:
          label: Operating flows →
          to: /bestpractice/node-red-guide/operating-flows/#deploy-modes
      - title: Debugging
        body: Tap the wire, surface node state, keep the flow observable.
        link:
          label: Operating flows →
          to: /bestpractice/node-red-guide/operating-flows/#debugging
  - type: linkCards
    heading: Worked example
    columns: 2
    items:
      - title: "Napkin: multi-surface app"
        body: One app reached three ways over shared services.
        link:
          label: Worked example →
          to: /bestpractice/node-red-guide/worked-example/#napkin-multi-surface-app
      - title: Good vs bad
        body: The same requirement built with and without seams.
        link:
          label: Worked example →
          to: /bestpractice/node-red-guide/worked-example/#good-vs-bad
