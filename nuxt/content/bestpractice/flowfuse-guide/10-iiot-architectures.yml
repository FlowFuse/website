title: IIoT architectures
blurb: Distributed edge nodes, each doing one small job, feeding one central system.
blocks:
  - type: prose
    kicker: IIoT architectures
    body: >-
      Distributed edge nodes, each reading a few sensors and doing one small job, feeding one central
      system. The value is the large-scale live picture that many small nodes add up to.
