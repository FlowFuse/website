                  sub: enterprise
                  tone: cloud
                - title: Historian
                  sub: enterprise
                  tone: cloud
                - title: Analytics
                  sub: enterprise
                  tone: cloud
            - link: subscribe
            - label: Enterprise · one namespace, every site rolls up
              tone: broker
              nodes:
                - title: Team Broker
                  sub: enterprise UNS
                  tone: broker
            - link: publish · Project Link
            - label: Sites · each already a cluster of edge nodes
              tone: ot
              nodes:
                - title: Site A
                  sub: a cluster of nodes
                  tone: ot
                - title: Site B
                  sub: a cluster of nodes
                  tone: ot
                - title: Site C
                  sub: a cluster of nodes
                  tone: ot
          legend:
            - label: Enterprise
              tone: cloud
            - label: Sites
              tone: ot
            - label: Project Link
              tone: it
            - label: MQTT / UNS
              tone: broker
        summary: >-
          Scale the same pattern across sites. Each site — itself a cluster of edge nodes — publishes
          into one enterprise namespace over Project Link, with no inbound ports. A single Team Broker
          carries every site's live data, and enterprise dashboards, historians and analytics subscribe
          across all of them.
        useWhen: The distributed-edge pattern spans multiple plants or geographies that must roll up to one enterprise view.
