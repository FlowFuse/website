        summary: >-
          The IIoT shape: many distributed Remote Instances, each reading just a few sensors and doing
          one small job, publish to a central Team Broker. One central app subscribes and sees every
          node at once. Each node is small — the value is the large-scale live picture they add up to.
          Think water-quality monitoring across dozens of pump stations.
        useWhen: Lots of small, spread-out measurement points that only pay off when aggregated into one live view.
      - label: Across many sites
        kicker: Enterprise · one namespace, every site rolls up
        diagram:
          lanes:
            - label: Enterprise consumers
              tone: cloud
