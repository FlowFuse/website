faqs:
  - question: "Can FlowFuse read data from a mixed fleet of CNC machines?"
    answer: "Yes. FlowFuse connects to machine tools over [MTConnect](/blog/2026/02/mapping-mtconnect-streams/), [OPC UA](/blog/2025/07/reading-and-writing-plc-data-using-opc-ua/), FOCAS, [Modbus TCP and RTU](/blog/2026/02/modbus-tcp-vs-modbus-rtu/), [EtherNet/IP](/blog/2025/10/using-ethernet-ip-with-flowfuse/), and [Siemens S7](/blog/2025/01/integrating-siemens-s7-plcs-with-node-red-guide/), and normalizes the tags in the flow. A Fanuc control and a Siemens control can feed the same utilization dashboard without a per-vendor gateway product."
  - question: "Can older machines with no network interface be included?"
    answer: "Yes. Machines that predate the plant network can be brought in over [RS232 or RS485](/blog/2025/07/connect-legacy-equipment-serial-flowfuse/), or by wiring run, stop, and cycle-complete signals into an edge device running the FlowFuse Device Agent. That is often the fastest way to get honest utilization numbers from legacy equipment."
  - question: "Can machine builders use FlowFuse in the equipment they sell?"
    answer: "Yes. For OEMs, FlowFuse can support applications that become part of the equipment and service offering sold to customers. Build operator dashboards, diagnostics, and maintenance notifications on suitable edge hardware, then manage deployments centrally. With customer-authorized connectivity, service teams can receive machine context remotely. Discuss your intended distribution, hosting, and support model with FlowFuse to establish the appropriate commercial arrangement."
  - question: "We are a small IT team supporting many machines. Does onboarding FlowFuse add headcount?"
    answer: "No, it's the opposite problem FlowFuse is usually brought in to solve. Walter Tools' seven-person IT team scaled from a single production unit to more than 130 instances, because flows are built once, version controlled, and deployed to every site rather than rebuilt per machine."
  - question: "Does FlowFuse predict machine failures?"
    answer: "Not on its own. FlowFuse supports condition monitoring and rule-based maintenance alerts using available sensor data, operating hours, and equipment limits. True predictive maintenance requires additional models, suitable historical data, and validation for the equipment involved. Begin with signals your team can act on, and treat an observed threshold violation as a trigger for review, not a prediction of failure."
  - question: "Can applications keep running without an internet connection?"
    answer: "Yes, with limits. Applications deployed through the Device Agent can continue running locally if the connection to the FlowFuse management platform is lost. They still depend on the services used by each flow, so design buffering, reconnection, and cloud-dependent steps accordingly. Receiving new deployments requires a connection to the management platform; self-hosted options support isolated environments."
