faqs:
  - question: "How does FlowFuse support high-mix, low-volume manufacturing?"
    answer: "In high-mix, low-volume assembly, a window or door can need a different size, glass package, frame, hardware set, or finish from the unit before it. Build workflows that load the requirements for the identified unit, guide the operator, check component scans, and record measurements. Reuse the workflow while changing its approved configuration data. This same high-mix, low-volume pattern shows up differently in [Industrial Machinery](/industries/industrial-machinery/), where it's a job-shop and precision-machining problem rather than an assemble-to-order one."
  - question: "Can we trace the exact configuration of an individual unit?"
    answer: "Yes, when a unique unit identifier and the relevant data are captured at each step. Link that identifier to the order and preserve the recorded as-built configuration, component or lot identifiers, inspection outcomes, substitutions, and rework. An order number alone is insufficient when the order contains multiple units. Define the system of record and how the application handles missing scans, duplicate identifiers, and revisions."
  - question: "Can we standardize across plants with different equipment and systems?"
    answer: "Yes. Connect each plant through the interfaces available there, normalize equipment and order data into a shared model, and reuse approved flow logic with site-specific configuration. Validate the pattern at representative equipment before wider rollout, because signal availability, controller access, and process details will vary by plant. Learn more about [FlowFuse's approach to manufacturing data integration](/use-cases/data-integration/)."
  - question: "Can older equipment with limited connectivity be included?"
    answer: "Often, but the approach depends on the equipment. Use a supported interface, protocol node, gateway, database connection, or additional sensing where appropriate. Equipment without accessible digital signals may require hardware work. Start with the data needed for the application and validate it on representative assets before committing to a fleet-wide design. See [FlowFuse Device Agent](/platform/device-agent/) for how this works on distributed, mixed-vintage equipment."
  - question: "Can FlowFuse produce the records needed for product certification or code compliance?"
    answer: "FlowFuse can collect, contextualize, and route available test and process data so records are easier to retrieve and report. The manufacturer remains responsible for the applicable standard, test method, approved equipment, retention policy, validation, and certification process. Do not treat a FlowFuse workflow as certification by itself."
  - question: "How does FlowFuse add manufacturing traceability alongside our ERP or MES?"
    answer: "Build Node-RED workflows that connect your ERP or [MES](/use-cases/mes/) to plant equipment, scanners, and operator inputs through available interfaces. Retrieve approved order and configuration data, link production, inspection, and rework events to each unique unit, and write records to the agreed destination. Your ERP or MES continues to handle the functions assigned to it, such as planning, inventory, or scheduling. Define record ownership and exception handling; the integrations, capture logic, and traceability views are configured for your production process."
closingCta:
