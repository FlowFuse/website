faqs:
  - question: "Can FlowFuse be deployed on-premise in an air-gapped environment?"
    answer: "Yes. FlowFuse supports fully self-hosted installation inside your own infrastructure, including air-gapped environments with no outbound connectivity. See the [installation documentation](/docs/install/introduction/) and the [Security Statement](/platform/security/)."
  - question: "Can FlowFuse enforce NADCAP and customer approval status?"
    answer: "Yes. You can build approval checks into the production workflow that block a job from releasing when a NADCAP or customer approval is missing or expired, and trigger renewals before they lapse. See [Shop Floor Communication](/use-cases/shop-floor-communication/)."
  - question: "Can FlowFuse link torque, weld, and NDT data to a part serial?"
    answer: "Yes. Process data from torque tools, weld controllers, ovens, and NDT systems is captured via [OPC UA](/docs/flowfuse-nodes/edge/opcua/), [MQTT](/blog/2024/06/how-to-use-mqtt-in-node-red/), Atlas Copco Open Protocol, or file-based exports, and linked automatically to the part serial and work order. See [Production Monitoring](/use-cases/production-monitoring/)."
  - question: "How does FlowFuse fit alongside our existing MES and ERP?"
    answer: "FlowFuse works alongside your [MES](/use-cases/mes/) and [ERP](/landing/enterprise-integration/) rather than replacing them. It connects to both and lets you build the plant-specific workflows your MES doesn't cover, without a vendor change request. See [MES](/use-cases/mes/) and [IT/OT middleware](/use-cases/it-ot-middleware/)."
  - question: "What is the difference between aerospace component manufacturing and OEM assembly?"
    answer: "Component manufacturers make individual precision parts; OEMs own the build record for the complete assembly. For component suppliers, compliance centers on FAI, travelers, and special process approvals; for OEMs, on process data linkage, NCR containment, and engineering change. See [Aerospace Component Manufacturing](/industries/aviation-aerospace/#aerospace-component-manufacturing)."
  - question: "Can we deploy the same validated workflow across several plants?"
    answer: "Yes. Applications are versioned and deployed from a single controlled platform across cells, programs, and sites. See [Remote Device Management](/use-cases/remote-device-management/)."
closingCta:
  heading: "What aerospace production challenges can we help with?"
  description: "Every aerospace manufacturer has different compliance, traceability, and operational challenges. FlowFuse lets you build the manufacturing applications your teams need using the systems already running your operation — from individual components to complete assemblies."
