faqs:
  - question: "Can FlowFuse integrate with our existing water or utility SCADA system?"
    answer: "Yes. FlowFuse connects to water, grid, and other [utility SCADA systems](/blog/2026/08/what-is-scada/) through supported protocol nodes, gateways, APIs, and database connections, then routes that data to dashboards, historians, analytics, and reporting. It runs alongside your existing SCADA; supervisory control and safety responsibilities stay with the systems and procedures designed for them."
  - question: "Do remote sites keep running if they lose connection?"
    answer: "Yes. Applications deployed through the [FlowFuse Device Agent](/platform/device-agent/) keep running on local hardware when the connection to the management platform drops. They still depend on the local devices, networks, and services each flow uses, and new deployments wait until the site reconnects. If data must survive the outage, design and test [store-and-forward buffering](/blog/2025/11/store-and-forward-edge-data-buffering/), storage limits, and reconnection behavior for that site."
  - question: "Can FlowFuse monitor renewables alongside water and grid assets?"
    answer: "Yes. FlowFuse collects data from inverters, battery systems, meters, and SCADA on [generation sites](/blog/2022/02/use-case-solar-afloat/), then normalizes it by site and asset. Teams can compare actual output against forecasts and track equipment alarms and storage status alongside water or grid monitoring. Available signals, forecast feeds, and permissions depend on the systems at each site."
  - question: "Can the same platform work for a small district and a national operator?"
    answer: "Yes. The deployment and governance model differs. Paloma Irrigation runs FlowFuse as a hands-on operator managing remote sites, while Energinet uses it for enterprise lifecycle management across critical national infrastructure. Scope the [hosting model](/blog/2026/04/cloud-edge-or-hybrid-how-to-choose-your-flowfuse-deployment/), access controls, support, and recovery process to the organization and its operational risk."
  - question: "Can operators control equipment from a FlowFuse dashboard?"
    answer: "Yes, within limits. A FlowFuse application can [write to connected systems](/blog/2025/11/building-hmi-for-equipment-control/) when the interface and permissions allow it. Each operator decides which actions are appropriate through its own engineering, cybersecurity, and risk process. Machine protection, interlocks, and safety functions stay in the controllers and safety systems validated for those duties."
  - question: "Does FlowFuse replace a historian or analytics platform?"
    answer: "No. FlowFuse is the integration and application layer that collects, transforms, contextualizes, and [routes data into a historian](/blog/2023/07/influxdb-historical-data/) or analytics platform. A historian stores time-series data and an analytics platform evaluates it; FlowFuse feeds both and can trigger workflows from the same data without replacing either."
