page: pricing
title: 'Frequently Asked <span class="text-indigo-600">Questions</span>'
items:
  - question: "Does FlowFuse offer annual discounts for FlowFuse Cloud?"
    answer: "Yes, Edge customers receive a free month when paying for a year of FlowFuse in advance. Simply choose yearly billing upon signup, or select it from the Billing area in the app."
  - question: "Are flat-fee or site-wide licenses available?"
    answer: "It is not possible at this time to purchase an unlimited-use license, but contact us to discuss pricing for your unique use case."
  - question: "Do you offer discounts for large-scale deployments?"
    answer: "Yes, we provide customized volume discounts for use cases requiring hundreds or thousands of Node-RED instances. Please <a href='/contact-us'>Contact Us</a> to discuss your specific requirements."
